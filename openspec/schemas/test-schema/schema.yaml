name: test-schema
version: 1
description: Custom workflow schema for test-schema
artifacts:
  - id: design
    generates: design.md
    description: Technical design decisions and implementation approach
    template: design.md
    requires: []
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    requires:
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md

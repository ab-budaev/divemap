services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: divemap
      POSTGRES_PASSWORD: divemap
      POSTGRES_DB: divemap
    volumes:
      - ./.data/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divemap -d divemap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/opt/divemap-backend/src
    depends_on:
      db:
        condition: service_healthy
    working_dir: /opt/divemap-backend
    volumes:
      - ./src:/opt/divemap-backend/src
    command: ["--reload"]
    ports:
      - "8000:8000"
